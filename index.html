function coachData(d){
  const r=dailyReview(d), prev=[];
  for(let k=Math.max(1,d-6);k<=d;k++) prev.push(dailyReview(k));
  const logged=prev.filter(z=>z.m.intake.cal||z.m.intake.protein||z.m.intake.water||z.w.completed||z.x.sleep?.hours);
  const avg=(arr,fn)=>arr.length?arr.reduce((a,z)=>a+Number(fn(z)||0),0)/arr.length:0;
  const avgProtein=avg(logged,z=>z.m.intake.protein);
  const avgWater=avg(logged,z=>z.m.intake.water);
  const workoutDays=logged.filter(z=>!z.i.rest&&z.w.prescribed);
  const completedDays=workoutDays.filter(z=>z.w.percentage>=100).length;
  let insights=[],actions=[],wins=[];
  if(r.m.intake.protein>=140)wins.push(`Protein target reached at <b>${r.m.intake.protein} g</b> today.`);
  if(r.m.intake.water>=3000)wins.push(`Hydration target reached at <b>${(r.m.intake.water/1000).toFixed(1)} L</b>.`);
  if(!r.i.rest&&r.w.percentage>=100)wins.push(`All prescribed workout sets received completion credit.`);
  if(Number(r.x.sleep?.hours||0)>=7)wins.push(`You logged <b>${r.x.sleep.hours} h</b> of sleep.`);
  if(r.m.intake.protein>0&&r.m.intake.protein<140){
    const gap=Math.round(140-r.m.intake.protein);
    insights.push(`Protein is your biggest nutrition gap today: <b>${gap} g</b> below the minimum target.`);
    actions.push(`Close the protein gap tomorrow with one protein-dense addition such as Greek/high-protein curd, tofu, paneer, soy chunks or roasted chana.`);
  }
  if(avgProtein>0&&avgProtein<130&&logged.length>=3){
    insights.push(`This is becoming a pattern: your ${logged.length}-day logged average is only <b>${avgProtein.toFixed(0)} g/day</b> protein.`);
    actions.push(`Increase protein density in an existing meal rather than simply eating more food.`);
  }
  if(r.m.intake.cal>0&&r.m.intake.cal<r.m.calTarget*.9){
    insights.push(`Energy intake is below roughly 90% of today's target (${r.m.intake.cal} vs ${r.m.calTarget} kcal).`);
    actions.push(`Add a normal planned meal component such as roti + dal + paneer/tofu rather than relying on snacks.`);
  }else if(r.m.intake.cal>r.m.calTarget*1.1){
    insights.push(`Calories are more than 10% above today's target (${r.m.intake.cal} vs ${r.m.calTarget} kcal).`);
    actions.push(`Keep the base meals intact tomorrow and reduce discretionary/high-calorie extras rather than cutting protein.`);
  }
  if(r.m.intake.water<3000){
    insights.push(`Hydration is at ${(r.m.intake.water/1000).toFixed(1)} L, below the 3 L goal.`);
    actions.push(`Add smaller amounts of water throughout the day instead of trying to catch up at night.`);
  }
  if(avgWater>0&&avgWater<2500&&logged.length>=3){
    insights.push(`Your recent logged hydration average is only ${(avgWater/1000).toFixed(1)} L/day.`);
    actions.push(`Make 500 ml a default morning/office increment so hydration becomes automatic.`);
  }
  const sleep=Number(r.x.sleep?.hours||0);
  if(sleep>0&&sleep<7){
    insights.push(`Recovery is limited by <b>${sleep} h</b> sleep today.`);
    actions.push(`Protect a 7+ hour sleep window tonight; recovery is part of the muscle-building plan.`);
  }
  if(workoutDays.length>=3&&completedDays/workoutDays.length<.75){
    insights.push(`Workout completion is inconsistent: <b>${completedDays}/${workoutDays.length}</b> recent training days reached 100%.`);
    actions.push(`Aim to complete the prescribed sets or use the built-in substitution option when needed.`);
  }
  if(!insights.length)insights.push(`Today's logs are broadly on track. Keep the same consistency rather than changing the plan unnecessarily.`);
  if(!actions.length)actions.push(`Repeat the base plan tomorrow and focus on progressive overload, hydration and recovery.`);
  const ranked=[["nutrition",r.scores.nutrition],["workout",r.scores.workout],["hydration",r.scores.hydration],["recovery",r.scores.recovery],["adherence",r.scores.adherence]].sort((a,b)=>a[1]-b[1]);
  const focus=ranked[0][0];
  const headline={nutrition:"Nutrition needs the most attention today.",workout:"Training execution is the main lever today.",hydration:"Hydration is the easiest win today.",recovery:"Recovery is the main lever today.",adherence:"Consistency is the main lever today."}[focus];
  const confidence=logged.length>=5?"High":logged.length>=3?"Medium":"Low";
  return {r,insights,actions,wins,headline,confidence};
}

function measure(d,f,v){measurements[d]={...(measurements[d]||{}),[f]:v};S.set("measurements",measurements)}
function chart(){
 let pts=[];for(let d=1;d<=30;d++){let x=S.get("day:"+d,null);if(x?.bodyWeight)pts.push([d,parseFloat(x.bodyWeight)])}
 let c=document.getElementById("chart");if(!c||pts.length<2)return;let ctx=c.getContext("2d"),W=c.clientWidth,H=190,D=devicePixelRatio||1;c.width=W*D;c.height=H*D;ctx.scale(D,D);
 let lo=Math.min(...pts.map(p=>p[1]))-1,hi=Math.max(...pts.map(p=>p[1]))+1;ctx.strokeStyle="#3A331F";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(34,10);ctx.lineTo(34,H-24);ctx.lineTo(W-8,H-24);ctx.stroke();
 ctx.strokeStyle="#D9A441";ctx.lineWidth=2;ctx.beginPath();pts.forEach((p,k)=>{let x=34+(p[0]-1)/29*(W-45),y=10+(hi-p[1])/(hi-lo)*(H-34);k?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();
 pts.forEach(p=>{let x=34+(p[0]-1)/29*(W-45),y=10+(hi-p[1])/(hi-lo)*(H-34);ctx.fillStyle="#D9A441";ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fill()})
}
function settings(){
 let m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="sheet">
 <div class="sheethead"><b>Settings & Backup</b><button onclick="this.closest('.modal').remove()">×</button></div>
 <label class="eyebrow">Program start date<input id="start" type="date" value="${profile.startDate}"></label>
 <div class="muted small" style="margin-top:8px">Today is Day ${currentDay()} of 30.</div>
 <div class="backupbox"><b>🎯 Daily goals</b><p class="muted small">Cut + muscle plan: ~2,200 kcal training / ~2,000 kcal rest · 140–150 g protein · 3 L water · target ~0.3–0.5 kg loss/week.</p></div>
 <div class="backupbox">
   <b>💾 Protect your progress</b>
   <p class="muted small">Your data is saved on this browser. Export a backup regularly so you can restore it if browser data is cleared or you move to another phone.</p>
   <button class="backupbtn" onclick="exportBackup()">⬇ Export My Data</button>
   <button class="backupbtn" onclick="document.getElementById('backupFile').click()">⬆ Import My Data</button>
   <input id="backupFile" type="file" accept=".json,application/json" style="display:none" onchange="importBackup(this)">
 </div>
 <button class="danger" onclick="resetAll();this.closest('.modal').remove()">↻ Reset all tracked data</button>
 </div>`;
 document.body.appendChild(m);
 document.getElementById("start").onchange=e=>{profile.startDate=e.target.value;S.set("profile",profile);selectedDay=currentDay();dayData=S.get("day:"+selectedDay,empty());render()}
}

function exportBackup(){
 const data={version:3,exportedAt:new Date().toISOString(),profile,measurements:{...measurements},days:{}};
 for(let d=1;d<=30;d++) data.days[d]=migrateDayData(S.get("day:"+d,null));
 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download="muscle-gain-backup-"+new Date().toISOString().slice(0,10)+".json";
 document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}
function importBackup(input){
 const file=input.files?.[0];if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
   try{
     const data=JSON.parse(reader.result);
     if(!data || typeof data!=="object" || !data.profile || !data.days) throw new Error("Invalid backup");
     if(!confirm("Import this backup? Your current tracker data will be replaced by the backup.")) return;
     S.set("profile",data.profile);
     profile=data.profile;
     measurements=data.measurements||{};
     S.set("measurements",measurements);
     for(let d=1;d<=30;d++){
       if(data.days[d]===null||data.days[d]===undefined) S.del("day:"+d);
       else S.set("day:"+d,data.days[d]);
     }
     selectedDay=currentDay();dayData=S.get("day:"+selectedDay,empty());
     document.querySelector(".modal")?.remove();
     render();
     alert("Backup restored successfully.");
   }catch(e){alert("This doesn't look like a valid Muscle Gain Tracker backup.");}
 };
 reader.readAsText(file);
}
function resetAll(){for(let d=1;d<=30;d++){S.del("day:"+d);S.del("photo:"+d)}S.del("measurements");measurements={};dayData=empty();render()}
document.addEventListener("click",e=>{let b=e.target.closest("[data-tab]");if(b){tab=b.dataset.tab;render()}});
window.load=load;window.currentDay=currentDay;window.quickWater=quickWater;window.savePhoto=savePhoto;window.setExerciseSet=setExerciseSet;window.addExerciseSet=addExerciseSet;window.removeExerciseSet=removeExerciseSet;window.addCustomExercise=addCustomExercise;window.setCustomSet=setCustomSet;window.addCustomSet=addCustomSet;window.removeCustomSet=removeCustomSet;window.removeCustomExercise=removeCustomExercise;window.exportBackup=exportBackup;window.importBackup=importBackup;window.toggleEx=toggleEx;window.setEx=setEx;window.toggleMeal=toggleMeal;window.toggleSetLogged=toggleSetLogged;window.toggleSubstitution=toggleSubstitution;window.measure=measure;window.settings=settings;window.resetAll=resetAll;window.addFood=addFood;window.addCustom=addCustom;window.removeFood=removeFood;
profile.startDate=profile.startDate||new Date().toISOString().slice(0,10);S.set("profile",profile);selectedDay=currentDay();dayData=migrateDayData(S.get("day:"+selectedDay,empty()));S.set("day:"+selectedDay,dayData);render();
</script>
</body>
</html>
