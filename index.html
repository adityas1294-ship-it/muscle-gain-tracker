function previousExercise(name,d){

  let z=x.exercises[j],ss=exerciseSets(j,i.exercises[j],x);let filled=ss.filter(s=>s.weight||s.reps);
  if(filled.length){let first=filled[0];return {weight:first.weight||"",reps:first.reps||"",sets:ss}}
}}
 return null;
}
function progressionHint(e,z,prev){

 let max=String(e[2]).match(/\d+/g)||[],upper=Number(max[max.length-1]||0), reps=String(z.reps).split(/[\/, ]+/).map(Number).filter(Boolean),best=Math.max(...reps,0);
 if(best>=upper)return `<div class="small gold" style="margin-top:7px">🟢 Rep target reached — consider increasing weight next session.</div>`;

function dailyReview(d){
 const i=info(d),x=dayRecord(d),m=reviewMealStats(d),w=reviewExerciseStats(d),water=m.intake.water,sleep=Number(x.sleep?.hours||0),quality=x.sleep?.quality||"", weight=x.bodyWeight?Number(x.bodyWeight):null;
 let scores={nutrition:0,workout:0,hydration:0,recovery:0,adherence:0};
 // Nutrition: calories + protein + meal logging. Partial credit is intentional.
 let calRatio=m.intake.cal/m.calTarget, proScore=m.intake.protein>=m.proLow?1:m.intake.protein/Math.max(1,m.proLow); let calScore=calRatio>=0.9&&calRatio<=1.1?1:calRatio>=0.8&&calRatio<=1.2?.75:calRatio>=0.65&&calRatio<=1.35?.5:.25;
 scores.nutrition=Math.round((calScore*.45+Math.min(1,proScore)*.45+(m.loggedMeals/m.totalMeals)*.10)*100);
 if(i.rest)scores.workout=100; else scores.workout=w.prescribed?Math.round((w.completed/w.prescribed)*80+Math.min(1,w.setsDone/Math.max(1,w.setsPlanned))*20):0;

 scores.adherence=Math.round((Math.min(1,m.loggedMeals/m.totalMeals)*.45+(i.rest?1:w.prescribed?Math.min(1,w.completed/w.prescribed):0)*.45+(x.notes?.trim()?1:0)*.10)*100);
 const overall=Math.round(scores.nutrition*.30+scores.workout*.25+scores.hydration*.15+scores.recovery*.15+scores.adherence*.15);
 let wins=[],improve=[];
 if(m.intake.protein>=140)wins.push(`Protein target met at <b>${m.intake.protein} g</b>.`); else improve.push(`Protein was <b>${m.intake.protein} g</b>; aim for at least 140 g.`);

 if(i.rest) wins.push(`<b>Recovery day respected.</b>`); else if(w.completed===w.prescribed&&w.prescribed) wins.push(`Workout completed: <b>${w.completed}/${w.prescribed}</b> exercises.`); else if(w.prescribed) improve.push(`Workout completion was <b>${w.completed}/${w.prescribed}</b> exercises.`);
 if(sleep>=7)wins.push(`Sleep duration was <b>${sleep} h</b>.`); else if(sleep)improve.push(`Sleep was <b>${sleep} h</b>; target 7+ h.`); else improve.push(`No sleep duration logged.`);
 const bestCat=Object.entries(scores).sort((a,b)=>b[1]-a[1])[0][0],worstCat=Object.entries(scores).sort((a,b)=>a[1]-b[1])[0][0];
 let priority={nutrition:"Prioritise protein and keep total calories close to today's target.",workout:"Complete the prescribed exercises and log every working set.",hydration:"Bring water to 3 L by adding small amounts throughout the day.",recovery:"Protect a 7+ hour sleep window tonight.",adherence:"Log meals and workout details consistently so the review can be more accurate."}[worstCat];
 return {i,x,m,w,scores,overall,wins,improve,priority,bestCat,worstCat,weight};
}

 const r=dailyReview(selectedDay),i=r.i;
 const tone=r.overall>=85?'🟢 Excellent':r.overall>=70?'🟡 Good':'🔴 Needs attention';
 const missing=!r.x.bodyWeight&&!r.m.intake.cal&&!r.m.intake.protein&&!r.m.intake.water&&!r.x.sleep?.hours&&!r.w.completed;
 return `<div class="titleblock"><div class="eyebrow gold">Daily Review</div><div class="reviewday"><div><h2>Day ${String(selectedDay).padStart(2,'0')}</h2><div class="muted">${esc(i.name)} · ${esc(i.title)}</div></div><button onclick="load(${selectedDay});tab='day';render()">Edit today →</button></div></div>
 ${missing?`<div class="card"><div class="empty"><div style="font-size:30px">🧠</div><h3>No enough data yet</h3><p>Log your meals, workout, water and sleep on the Today tab. I'll automatically review them here.</p><button class="backupbtn" onclick="tab='day';render()">Go to Today</button></div></div>`:`<div class="card"><div class="reviewscore"><div class="scorecircle">${r.overall}</div><div><div class="eyebrow">Today's score</div><h3 style="margin:4px 0">${tone}</h3><div class="muted small">Based on nutrition, workout, hydration, recovery and logging consistency.</div></div></div></div>
 <div class="card"><div class="cardtitle">📊 Category scores</div><div class="reviewgrid" style="margin-top:10px">${[['nutrition','🍽️ Nutrition'],['workout','🏋️ Workout'],['hydration','💧 Hydration'],['recovery','😴 Recovery'],['adherence','📋 Adherence']].map(([k,l])=>`<div class="reviewitem"><b>${l}</b><strong>${r.scores[k]}/100</strong></div>`).join('')}</div></div>
 <div class="card"><div class="cardtitle">🟢 What went well</div>${r.wins.length?`<ul class="reviewlist">${r.wins.map(x=>`<li>${x}</li>`).join('')}</ul>`:`<div class="muted small" style="margin-top:8px">Keep logging — there isn't enough positive evidence yet.</div>`}</div>
 <div class="card"><div class="cardtitle">⚠️ What needs improvement</div>${r.improve.length?`<ul class="reviewlist">${r.improve.map(x=>`<li>${x}</li>`).join('')}</ul>`:`<div class="feedback">No major gaps detected today.</div>`}</div>
 <div class="card"><div class="eyebrow gold">🎯 Tomorrow's #1 focus</div><div class="priority" style="margin-top:7px"><b>${esc(r.priority)}</b></div></div>
 <div class="card"><div class="cardtitle">🍽️ Meal benchmark</div><div class="reviewgrid" style="margin-top:10px"><div class="reviewitem"><b>Calories</b><strong>${r.m.intake.cal} / ${r.m.calTarget}</strong></div><div class="reviewitem"><b>Protein</b><strong>${r.m.intake.protein} / 140–150g</strong></div><div class="reviewitem"><b>Meals logged</b><strong>${r.m.loggedMeals} / ${r.m.totalMeals}</strong></div><div class="reviewitem"><b>Water</b><strong>${(r.m.intake.water/1000).toFixed(1)} / 3.0 L</strong></div></div></div>
 <div class="card"><div class="cardtitle">🏋️ Workout benchmark</div><div class="reviewgrid" style="margin-top:10px"><div class="reviewitem"><b>Exercises</b><strong>${r.w.completed} / ${r.w.prescribed}</strong></div><div class="reviewitem"><b>Sets logged</b><strong>${r.w.setsDone}</strong></div><div class="reviewitem"><b>Extra exercises</b><strong>${r.w.customCount}</strong></div><div class="reviewitem"><b>Sleep</b><strong>${r.x.sleep?.hours?r.x.sleep.hours+' h':'—'}</strong></div></div></div>
 ${r.x.notes?.trim()?`<div class="card"><div class="cardtitle">📝 Your notes</div><div class="muted small" style="margin-top:8px">${esc(r.x.notes)}</div></div>`:''}`}
 <div class="card"><div class="muted small">Review updates automatically whenever you save today's logs. It uses the tracker rules and your base-plan targets; it does not diagnose medical issues.</div></div>`;
}

function progress(){
 let pts=[];for(let d=1;d<=30;d++){let x=dayRecord(d);if(x.bodyWeight)pts.push([d,parseFloat(x.bodyWeight)])}
 let change=pts.length>1?(pts.at(-1)[1]-pts[0][1]).toFixed(1):null;
 let weeks=[1,2,3,4,5].map(w=>weekStats(w));
 let strength=topStrengths().slice(0,8);
 return `<div class="titleblock"><div class="eyebrow gold">Progress</div><h2>30-day dashboard</h2></div>
 <div class="card"><div class="cardtitle">⚖️ Weight trend</div>${pts.length>1?`<canvas id="chart"></canvas><div class="center muted">Change so far: <b class="${change>=0?"gold":"rust"}">${change>0?"+":""}${change} kg</b> · target +0.1 to +0.25 kg/week`:`<div class="empty">Log body weight on at least two days to see your trend.</div>`}</div></div>
 <div class="card"><div class="cardtitle">📊 Weekly averages</div><div class="history">${weeks.map(w=>`<div class="strengthrow"><span><b>Week ${w.start===29?"5 · Reassessment":Math.ceil(w.start/7)}</b><small>${w.weightCount?"Avg weight "+w.avgWeight.toFixed(1)+" kg":"No weight data"}</small></span><span style="text-align:right"><b>${w.avgProtein?w.avgProtein.toFixed(0)+"g protein":"—"}</b><small>${w.avgCal?w.avgCal.toFixed(0)+" kcal":"—"} · ${w.workouts}/${w.planned} workouts</small></span></div>`).join("")}</div></div>
 <div class="card"><div class="cardtitle">🏋️ Strength progression</div>${strength.map(name=>{let h=exerciseHistory(name),first=h[0],last=h.at(-1),gain=first&&last?last.weight-first.weight:0;return `<div class="strengthrow"><span><b>${esc(name)}</b><small>${first?first.weight+" kg → "+last.weight+" kg":"No data yet"}</small></span><span class="${gain>0?"gold":gain<0?"rust":"muted"}">${first?(gain>0?"+":"")+gain.toFixed(1)+" kg":"—"}</span></div>`}).join("")}</div>
 <div class="eyebrow rust">Milestone measurements</div><div class="muted small">Recorded on Days 1, 15 and 30 · same conditions each time</div>${[1,15,30].map(d=>`<div class="card"><div class="gold mono">Day ${d}</div><div class="measuregrid">${[["weight","Weight (kg)"],["waist","Waist (cm)"],["chest","Chest (cm)"],["arm","Arm (cm)"],["thigh","Thigh (cm)"]].map(f=>`<label><span>${f[1]}</span><input type="number" step=".1" value="${esc(measurements[d]?.[f[0]]||"")}" onchange="measure(${d},'${f[0]}',this.value)"></label>`).join("")}</div></div>`).join("")}
 <div class="card"><div class="cardtitle">📸 Progress photos</div><div class="muted small">Add photos for Day 1, 15 and 30. They remain on this device/browser.</div>${[1,15,30].map(d=>`<div class="photo-box" style="margin-top:8px"><b>Day ${d}</b><div id="photo-preview-${d}">${S.get("photo:"+d,"")?`<img src="${S.get("photo:"+d,"")}">`:""}</div><input type="file" accept="image/*" onchange="savePhoto(${d},this)"></div>`).join("")}</div>
 <div class="card"><div class="cardtitle">📋 Day-30 report</div><div class="report">${reportHtml()}</div></div>`;
}
function savePhoto(d,input){
 const file=input.files?.[0];if(!file)return;const r=new FileReader();r.onload=()=>{S.set("photo:"+d,r.result);render()};r.readAsDataURL(file);
}
function reportHtml(){
 const w1=weekStats(1),w5=weekStats(5),d1=dayRecord(1),d30=dayRecord(30),start=d1.bodyWeight,end=d30.bodyWeight;
 const allW=[];for(let d=1;d<=30;d++){let x=dayRecord(d);if(x.bodyWeight)allW.push(Number(x.bodyWeight))}
 const avgW=allW.length?(allW.reduce((a,b)=>a+b,0)/allW.length).toFixed(1):"—";
 const workouts=[1,2,3,4].reduce((a,w)=>a+weekStats(w).workouts,0),planned=[1,2,3,4].reduce((a,w)=>a+weekStats(w).planned,0);
 return `<p><b>Weight:</b> ${start||"—"} → ${end||"—"} kg ${start&&end?`(${(Number(end)-Number(start)>0?"+":"")+(Number(end)-Number(start)).toFixed(1)} kg)`:""}</p><p><b>Average logged weight:</b> ${avgW} kg</p><p><b>Workout adherence:</b> ${workouts}/${planned} planned sessions</p><p><b>Average protein:</b> ${[1,2,3,4].map(weekStats).filter(x=>x.avgProtein).length?([1,2,3,4].map(weekStats).filter(x=>x.avgProtein).reduce((a,x)=>a+x.avgProtein,0)/[1,2,3,4].map(weekStats).filter(x=>x.avgProtein).length).toFixed(0)+" g/day":"—"}</p><p><b>Average water:</b> ${[1,2,3,4].map(weekStats).filter(x=>x.avgWater).length?([1,2,3,4].map(weekStats).filter(x=>x.avgWater).reduce((a,x)=>a+x.avgWater,0)/[1,2,3,4].map(weekStats).filter(x=>x.avgWater).length/1000).toFixed(2)+" L/day":"—"}</p><p class="muted">Complete Days 1 and 30 measurements for the most useful before/after comparison.</p>`;
}

function render(){
 document.getElementById("app").innerHTML=`<div class="top"><div><div class="brand">MUSCLE GAIN — 30 DAY</div><div class="sub">Vegetarian · Dairy · No eggs · No whey</div></div><button class="settings" onclick="settings()">⚙️</button></div>`+(tab==="day"?day():tab==="overview"?overview():tab==="review"?review():progress());
 document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
 let bw=document.getElementById("bw");if(bw)bw.onchange=()=>{dayData.bodyWeight=bw.value;save()};
 let n=document.getElementById("notes");if(n)n.oninput=()=>{dayData.notes=n.value;save()};
 let sh=document.getElementById("sleepHours");if(sh)sh.onchange=()=>{dayData.sleep={...(dayData.sleep||{}),hours:sh.value};save()};
 let sq=document.getElementById("sleepQuality");if(sq)sq.onchange=()=>{dayData.sleep={...(dayData.sleep||{}),quality:sq.value};save()};
 if(tab==="progress")setTimeout(chart,0)
}
function quickWater(ml){
 dayData.mealEntries=dayData.mealEntries||{};dayData.mealEntries.wake=dayData.mealEntries.wake||[];
 dayData.mealEntries.wake.push({name:ml===1000?"Water 1 litre":"Water 500 ml",cal:0,protein:0,qty:ml===250?.5:ml===500?1:2});
 save();render();
}
function toggleEx(j){dayData.exercises=dayData.exercises||{};dayData.exercises[j]={...(dayData.exercises[j]||{}),done:!(dayData.exercises[j]?.done)};save();render()}
function setEx(j,f,v){dayData.exercises=dayData.exercises||{};dayData.exercises[j]={...(dayData.exercises[j]||{}),[f]:v};save()}
function toggleMeal(id){dayData.meals=dayData.meals||{};dayData.meals[id]=!dayData.meals[id];save();render()}
function measure(d,f,v){measurements[d]={...(measurements[d]||{}),[f]:v};S.set("measurements",measurements)}
function chart(){
 let pts=[];for(let d=1;d<=30;d++){let x=S.get("day:"+d,null);if(x?.bodyWeight)pts.push([d,parseFloat(x.bodyWeight)])}
 let c=document.getElementById("chart");if(!c||pts.length<2)return;let ctx=c.getContext("2d"),W=c.clientWidth,H=190,D=devicePixelRatio||1;c.width=W*D;c.height=H*D;ctx.scale(D,D);
 let lo=Math.min(...pts.map(p=>p[1]))-1,hi=Math.max(...pts.map(p=>p[1]))+1;ctx.strokeStyle="#3A331F";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(34,10);ctx.lineTo(34,H-24);ctx.lineTo(W-8,H-24);ctx.stroke();
 ctx.strokeStyle="#D9A441";ctx.lineWidth=2;ctx.beginPath();pts.forEach((p,k)=>{let x=34+(p[0]-1)/29*(W-45),y=10+(hi-p[1])/(hi-lo)*(H-34);k?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();
 pts.forEach(p=>{let x=34+(p[0]-1)/29*(W-45),y=10+(hi-p[1])/(hi-lo)*(H-34);ctx.fillStyle="#D9A441";ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fill()})
}
function settings(){
 let m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="sheet">
 <div class="sheethead"><b>Settings & Backup</b><button onclick="this.closest('.modal').remove()">×</button></div>
 <label class="eyebrow">Program start date<input id="start" type="date" value="${profile.startDate}"></label>
 <div class="muted small" style="margin-top:8px">Today is Day ${currentDay()} of 30.</div>
 <div class="backupbox"><b>🎯 Daily goals</b><p class="muted small">Current plan: ~2,650 kcal training / ~2,500 kcal rest · 140–150 g protein · 3 L water.</p></div>
 <div class="backupbox">
   <b>💾 Protect your progress</b>
   <p class="muted small">Your data is saved on this browser. Export a backup regularly so you can restore it if browser data is cleared or you move to another phone.</p>
   <button class="backupbtn" onclick="exportBackup()">⬇ Export My Data</button>
   <button class="backupbtn" onclick="document.getElementById('backupFile').click()">⬆ Import My Data</button>
   <input id="backupFile" type="file" accept=".json,application/json" style="display:none" onchange="importBackup(this)">
 </div>
 <button class="danger" onclick="resetAll();this.closest('.modal').remove()">↻ Reset all tracked data</button>
 </div>`;
 document.body.appendChild(m);
 document.getElementById("start").onchange=e=>{profile.startDate=e.target.value;S.set("profile",profile);selectedDay=currentDay();dayData=S.get("day:"+selectedDay,empty());render()}
}

function exportBackup(){
 const data={version:1,exportedAt:new Date().toISOString(),profile,measurements:{...measurements},days:{}};
 for(let d=1;d<=30;d++) data.days[d]=S.get("day:"+d,null);
 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download="muscle-gain-backup-"+new Date().toISOString().slice(0,10)+".json";
 document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}
function importBackup(input){
 const file=input.files?.[0];if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
   try{
     const data=JSON.parse(reader.result);
     if(!data || typeof data!=="object" || !data.profile || !data.days) throw new Error("Invalid backup");
     if(!confirm("Import this backup? Your current tracker data will be replaced by the backup.")) return;
     S.set("profile",data.profile);
     profile=data.profile;
     measurements=data.measurements||{};
     S.set("measurements",measurements);
     for(let d=1;d<=30;d++){
       if(data.days[d]===null||data.days[d]===undefined) S.del("day:"+d);
       else S.set("day:"+d,data.days[d]);
     }
     selectedDay=currentDay();dayData=S.get("day:"+selectedDay,empty());
     document.querySelector(".modal")?.remove();
     render();
     alert("Backup restored successfully.");
   }catch(e){alert("This doesn't look like a valid Muscle Gain Tracker backup.");}
 };
 reader.readAsText(file);
}
function resetAll(){for(let d=1;d<=30;d++){S.del("day:"+d);S.del("photo:"+d)}S.del("measurements");measurements={};dayData=empty();render()}
document.addEventListener("click",e=>{let b=e.target.closest("[data-tab]");if(b){tab=b.dataset.tab;render()}});
window.load=load;window.currentDay=currentDay;window.quickWater=quickWater;window.savePhoto=savePhoto;window.setExerciseSet=setExerciseSet;window.addExerciseSet=addExerciseSet;window.removeExerciseSet=removeExerciseSet;window.addCustomExercise=addCustomExercise;window.setCustomSet=setCustomSet;window.addCustomSet=addCustomSet;window.removeCustomSet=removeCustomSet;window.removeCustomExercise=removeCustomExercise;window.exportBackup=exportBackup;window.importBackup=importBackup;window.toggleEx=toggleEx;window.setEx=setEx;window.toggleMeal=toggleMeal;window.measure=measure;window.settings=settings;window.resetAll=resetAll;window.addFood=addFood;window.addCustom=addCustom;window.removeFood=removeFood;
profile.startDate=profile.startDate||new Date().toISOString().slice(0,10);S.set("profile",profile);selectedDay=currentDay();dayData=S.get("day:"+selectedDay,empty());render();
</script>
</body>
</html>
